<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Your Receipt | CJ Finds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="receipt.css" />
</head>
<body>
  <main class="stage">
    <!-- The receipt machine -->
    <div class="printer" id="printer" aria-hidden="true">
      <span class="led"></span>
      <div class="slot"></div>
    </div>

    <!-- The paper slides down out of the slot -->
    <div class="paper-wrap" id="paperWrap">
      <article class="paper" id="paper" aria-label="Receipt"></article>
    </div>

    <p class="msg" id="msg" role="status" hidden></p>
  </main>

  <script type="module" src="receipt.js"></script>
</body>
</html>
